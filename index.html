<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP(Combined Admin Pannel)</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="p1_left">
            <img src="./assets/images/KPRIET_CAP.webp" alt="">
        </div>
        <div class="p1_right">
                <div class="p1_r_1">
                    <div class="p1_r_1_d1">
                        <div class="p1_r_1_d1_top">
                            <img src="./assets/images/KPRIET_CAP (1).webp" alt="" class="logo">
                        </div>
                        <div class="p1_r_1_d1_mid">
                            <div class="h3">
                                <h3>Welcome to CAP</h3>
                            </div>
                            <div class="p">
                                <p>Combined Admin Panel.</p>
                            </div>
                        </div>
                        <div class="p1_r_1_d1_low">
                            <button><a href=""><img src="./assets/images/google.png" class="google" alt=""><p>Sign in with Google</p></a></button>
                        </div>
                    </div>
                    <div class="p1_r_1_d2">
                        <div class="d2_first">
                            <span></span><p>or sign in with</p><span></span>
                        </div>
                        <div class="d2_second">
                            <div class="d2_user">
                                <label for="Username">Username</label>
                                <input type="text" placeholder="">
                                <!-- <i class="fa-solid fa-user" style="color: #000000;"></i> -->
                            </div>
                            <div class="d2_password">
                                <label for="Password">Password</label>
                                <input type="text" >
                                <!-- <i class="fa-solid fa-eye-slash" style="color: #000000;"></i> -->
                            </div>
                        </div>
                        <div class="d2_third">
                            <div class="d2_third_forgot">
                                <a href=""><i class="fa-solid fa-lock" style="color: #B00020;"></i>Forgot Password</a>
                            </div>

                            <div class="d2_third_sign_in">
                                <button><i class="fa-solid fa-right-to-bracket" style="color: #ffffff;"></i><p>Sign in</p></button>
                            </div>
                        </div>
                        <div class="d2_fourth">
                            <div class="last_1">
                                <div class="last_p1">To create an account ,<b> Contact ITSIM </b></div>
                                <div class="last_p2">© 2025. powered by ITSIM, <a href="https://www.kpriet.ac.in/"><b>KPRIET</b></a></div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</body>
</html>
